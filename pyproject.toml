[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-agent-network"
version = "0.1.0"
description = "Minimal evaluation scaffold for experience-conditioned runtime agent coordination"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

